[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnp-research"
version = "0.1.0"
description = "Evidence for the talk: from detection to predicting micro- and nanoplastic behaviour"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "lxml>=5",
    "pydantic>=2",
    "jsonschema>=4.21",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "emcee>=3.1",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "torch>=2.2,<3",
    "sbi==0.27.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/mnp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running (NPE training, SBC); run with -m slow"]
filterwarnings = ["ignore::DeprecationWarning"]
