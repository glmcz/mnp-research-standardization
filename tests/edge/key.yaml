  reasoning: 'Martin, 2026-09-13. A stated composition establishes ionic strength when the calculation follows directly from explicitly stated ionic species and concentrations: 0.137 M NaCl + 0.0027 M KCl = 139.7 mM. Record it, and flag it as derived rather than printed. The phosphate is excluded because its speciation at pH 7.4 is not stated.'
C2:
