  reasoning: 'Martin, 2026-09-13. Incubation is not measurement. Only a temperature explicitly associated with the zeta-potential measurement counts; incubation, exposure and culture temperature are separate conditions, even when no other temperature is given and even when the paper''s own variable is temperature.'
